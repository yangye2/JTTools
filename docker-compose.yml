# =============================================================================
# JTTools 部署文件
#
# 镜像由 GitHub Actions 自动构建并推送到 ghcr.io，这里直接拉取使用，
# 所以 VPS 上不需要 .NET SDK，也不需要在服务器上编译。
#
# 用法（在仓库根目录执行）：
#   docker compose pull              # 拉取最新镜像
#   docker compose up -d             # 启动
#   docker compose ps                # 查看状态（含健康检查结果）
#   docker compose logs -f           # 实时日志
#   docker compose restart           # 重启
#   docker compose down              # 停止并删除容器
#
# 更新到最新版本：
#   docker compose pull && docker compose up -d
#
# 镜像构建流程见 .github/workflows/docker.yml
# =============================================================================

name: jttools

services:
  jttools:
    # ------------------------------ 镜像 ------------------------------
    # GitHub Actions 构建的镜像（公开，VPS 无需 docker login）
    image: ghcr.io/yangye2/jttools:latest

    # 想在本机/服务器上自己编译镜像时，注释掉上面的 image，
    # 改用下面这段，然后执行 docker compose up -d --build
    # build:
    #   context: ./src
    #   dockerfile: Dockerfile
    #   args:
    #     BUILD_CONFIGURATION: Release

    container_name: jttools

    # ------------------------------ 运行 ------------------------------
    restart: unless-stopped

    ports:
      # 宿主机端口:容器端口。对外仍是 18889，和原来的 systemd 部署保持一致
      - "18889:8080"

    environment:
      ASPNETCORE_ENVIRONMENT: Production
      # 这一行必须保留：容器内要监听 8080，否则会用 appsettings.json 里的 18889
      ASPNETCORE_URLS: http://+:8080
      TZ: Asia/Shanghai
      # 排查问题时再打开，可以看更详细的日志
      # Logging__LogLevel__Default: Debug

    # ---------------------------- 健康检查 ----------------------------
    # 依赖应用里的 GET /health 端点（见 src/JTTools/Program.cs 的 MapHealthChecks）
    # 脚本用 bash 内置 /dev/tcp 发 HTTP 请求，不依赖 curl
    healthcheck:
      test: ["CMD", "timeout", "5", "bash", "/app/scripts/healthcheck.sh"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

    # ------------------------ 日志轮转（必配） ------------------------
    # 不加限制时容器日志会无限增长，很容易把 VPS 磁盘写满
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    # ---------------------------- 安全加固 ----------------------------
    # 容器内已经用非 root 用户（app，UID 1654）运行
    security_opt:
      - no-new-privileges:true
    # 应用运行期间不写磁盘，可以进一步打开只读根文件系统（如遇问题就注释掉）
    # read_only: true
    # tmpfs:
    #   - /tmp

    # ------------------------ 资源限制（可选） ------------------------
    # 解析超大报文或并发较高时，按 VPS 配置调整
    # deploy:
    #   resources:
    #     limits:
    #       memory: 512M
    #       cpus: "1.0"
