name: Docker 镜像

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

env:
  # ghcr.io/<你的用户名>/jttools，用户名用 github.repository_owner 动态取
  # （Docker 镜像名必须全小写，所以这里没有直接用 github.repository）
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/jttools

jobs:
  docker:
    name: 构建镜像
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write      # 推送镜像到 ghcr.io 需要

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      # 只有需要构建 arm64 镜像时才用得上；只构建 amd64 的话可以删掉这一步
      - name: 设置 QEMU
        uses: docker/setup-qemu-action@v3

      - name: 设置 Buildx
        uses: docker/setup-buildx-action@v3

      # PR 不推送镜像，只在 CI 里验证 Dockerfile 能构建成功
      - name: 登录 GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 生成镜像标签
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: 构建并推送
        uses: docker/build-push-action@v6
        with:
          # 构建上下文是 src 目录（Dockerfile 和 .dockerignore 都在那里）
          context: ./src
          file: ./src/Dockerfile

          # 默认只构建 amd64，CI 跑得快。
          # 如果 VPS 是 ARM 架构（如 Oracle/Ampere），改成下面这行：
          # platforms: linux/amd64,linux/arm64
          platforms: linux/amd64

          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

          # 复用构建缓存，后续构建会快很多
          cache-from: type=gha
          cache-to: type=gha,mode=max

          build-args: |
            BUILD_CONFIGURATION=Release

      - name: 输出镜像信息
        run: |
          echo "## 镜像已构建" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "${{ steps.meta.outputs.tags }}" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "在 VPS 上拉取：" >> $GITHUB_STEP_SUMMARY
          echo '```bash' >> $GITHUB_STEP_SUMMARY
          echo "docker pull ${{ env.IMAGE_NAME }}:latest" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
